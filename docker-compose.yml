# Local stack: the pipeline + PostgreSQL. Credentials come from your .env file (see .env.example).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres_user
      POSTGRES_PASSWORD: postgres_password  # local development only
      POSTGRES_DB: github_trends
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres_user -d github_trends"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres_user:postgres_password@db:5432/github_trends
      # Use Ollama running on your machine for the AI summary (skipped if it isn't running).
      OLLAMA_HOST: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Write reports/ and data/outputs/ back to the host.
      - ./reports:/app/reports
      - ./data/outputs:/app/data/outputs

volumes:
  postgres_data:
